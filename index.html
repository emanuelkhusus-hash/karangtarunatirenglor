<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karang Taruna Hub - Aplikasi Pengumuman</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="app">
        <!-- Auth Section (Login/Register) -->
        <section id="auth-section" class="screen active">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo-circle">
                        <i class="fas fa-users-viewfinder"></i>
                    </div>
                    <h1>Karang Taruna<span>Hub</span></h1>
                    <p>Silakan masuk atau daftar untuk melanjutkan</p>
                </div>

                <form id="auth-form">
                    <div class="input-group">
                        <label for="reg-name">Nama Lengkap</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="reg-name" placeholder="Masukkan nama lengkap..." required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="login-id">Password Akun</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-id" placeholder="Masukkan password..." required>
                        </div>
                    </div>
                    <button type="submit" id="btn-login" class="btn-primary">
                        <span>Masuk / Daftar</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>&copy; 2024 Karang Taruna Digital System</p>
                </div>
            </div>
        </section>

        <!-- Main Dashboard Section -->
        <section id="main-section" class="screen">
            <!-- Navigation -->
            <nav class="top-nav">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">?</div>
                    <div>
                        <h2 id="display-name">User Name</h2>
                        <span id="display-role">Anggota</span>
                    </div>
                </div>
                <div class="nav-actions">
                    <button id="btn-logout" title="Keluar"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </nav>

            <main class="content">
                <!-- Filters -->
                <div class="filter-bar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-announcement" placeholder="Cari pengumuman...">
                    </div>
                    <div class="filter-actions">
                        <select id="filter-sender">
                            <option value="all">Semua Pengirim</option>
                            <option value="Ketua">Ketua</option>
                            <option value="Sekretaris">Sekretaris</option>
                            <option value="Bendahara">Bendahara</option>
                        </select>
                        <select id="filter-month">
                            <option value="all">Semua Bulan</option>
                            <!-- Months will be populated by JS -->
                        </select>
                    </div>
                </div>

                <!-- Announcement List -->
                <div class="announcement-container">
                    <div class="section-header">
                        <h3>Pengumuman Terbaru</h3>
                        <span id="announcement-count">0 Pesan</span>
                    </div>
                    <div id="announcement-list" class="list-wrapper">
                        <!-- Loading State -->
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>Mengambil data...</p>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Bottom Actions (Floating Button for Admin) -->
            <div id="admin-actions" class="hidden">
                <button id="btn-add-post" class="fab-btn">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <!-- Bottom Navigation -->
            <footer class="bottom-nav">
                <button class="nav-item active" data-target="home">
                    <i class="fas fa-home"></i>
                    <span>Beranda</span>
                </button>
                <button class="nav-item" id="nav-members" data-target="members">
                    <i class="fas fa-address-book"></i>
                    <span>Anggota</span>
                    <span id="member-badge" class="badge-notify hidden">0</span>
                </button>
                <button class="nav-item" data-target="profile">
                    <i class="fas fa-user-circle"></i>
                    <span>Profil</span>
                </button>
            </footer>
        </section>

        <!-- Modals -->
        <div id="modal-overlay" class="modal-overlay">
            <!-- Modal Post -->
            <div id="modal-post" class="modal-content">
                <div class="modal-header">
                    <h3>Buat Pengumuman</h3>
                    <button class="btn-close">&times;</button>
                </div>
                <form id="post-form">
                    <div class="input-group">
                        <label>Judul Pengumuman</label>
                        <input type="text" id="post-title" placeholder="Tulis judul..." required>
                    </div>
                    <div class="input-group">
                        <label>Isi Pesan</label>
                        <textarea id="post-content" rows="6" placeholder="Tulis pesan lengkap di sini..."
                            required></textarea>
                    </div>
                    <button type="submit" class="btn-primary full-width">Kirim Pengumuman</button>
                </form>
            </div>

            <!-- Modal Detail -->
            <div id="modal-detail" class="modal-content">
                <div class="modal-header">
                    <div class="sender-info">
                        <div class="avatar small" id="detail-avatar"></div>
                        <div>
                            <h4 id="detail-sender">Nama Pengirim</h4>
                            <span id="detail-date">Tanggal</span>
                        </div>
                    </div>
                    <button class="btn-close">&times;</button>
                </div>
                <div class="modal-body">
                    <h2 id="detail-title">Judul</h2>
                    <div id="detail-body" class="rich-text">
                        <!-- Message content -->
                    </div>
                </div>
            </div>
            </section>
        </div>

        <script src="script.js"></script>
</body>

</html>
