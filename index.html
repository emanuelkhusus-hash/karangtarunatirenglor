<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karang Taruna Hub - Aplikasi Pengumuman</title>
    <link rel="stylesheet" href="style.css?v=6">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>

<body>
    <div id="app">
        <!-- Auth Section (Login/Register) -->
        <section id="auth-section" class="screen active">
            <div class="auth-watermark"></div>
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo-circle">
                        <img src="karang_taruna_logo.png" alt="Logo" id="login-logo-img">
                    </div>
                    <h2 class="logo-subtext">Watuireng Lor</h2>
                    <h1>Karang Taruna<span>Hub</span></h1>
                    <p>KarangTaruna Watuireng Lor Desa Platarejo Tahun <span id="current-year"></span></p>
                </div>

                <form id="auth-form">
                    <div class="input-group">
                        <label for="reg-name">Nama Lengkap</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="reg-name" placeholder="Masukkan nama lengkap..." required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="login-id">Password Akun</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-id" placeholder="Masukkan password..." required>
                        </div>
                    </div>
                    <button type="submit" id="btn-login" class="btn-primary">
                        <span>Masuk / Daftar</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>&copy; <span id="footer-year">2024</span> Karang Taruna Digital System</p>
                </div>
            </div>
        </section>

        <!-- Main Dashboard Section -->
        <section id="main-section" class="screen">
            <!-- Navigation -->
            <nav class="top-nav">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">?</div>
                    <div>
                        <h2 id="display-name">User Name</h2>
                        <span id="display-role">Anggota</span>
                    </div>
                </div>
                <div class="nav-actions">
                    <button id="btn-logout" title="Keluar"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </nav>

            <main class="content">
                <!-- Filters -->
                <div class="filter-bar">
                    <div class="filter-header">
                        <h4>Pencarian & Filter</h4>
                        <button onclick="resetFilters(true)" class="btn-icon-reset" title="Refresh Data">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-announcement" placeholder="Cari judul atau isi pengumuman...">
                    </div>
                    <div class="filter-actions">
                        <div class="select-wrapper">
                            <i class="fas fa-user-tag"></i>
                            <select id="filter-sender">
                                <option value="all">Semua Kiriman</option>
                                <option value="Ketua">Ketua</option>
                                <option value="Sekretaris">Sekretaris</option>
                                <option value="Bendahara">Bendahara</option>
                            </select>
                        </div>
                        <div class="select-wrapper">
                            <i class="fas fa-calendar-alt"></i>
                            <select id="filter-month">
                                <option value="all">Semua Bulan</option>
                                <!-- Months will be populated by JS -->
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Member Search Bar -->
                <div id="member-search-container" class="filter-bar hidden">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-member-input" placeholder="Cari nama atau jabatan..." oninput="renderMembers(allMembers)">
                    </div>
                </div>

                <!-- Profile Section -->
                <div id="profile-section" class="hidden">
                    <!-- Profile content will be injected by JS -->
                </div>

                <!-- Announcement List -->
                <div id="announcement-container" class="announcement-container">
                    <div class="section-header">
                        <h3>Pengumuman Terbaru</h3>
                        <span id="announcement-count">0 Pesan</span>
                    </div>
                    <div id="announcement-list" class="list-wrapper">
                        <!-- Content will be injected by JS -->
                    </div>
                </div>

                <!-- Finance Section -->
                <div id="finance-section" class="hidden">
                    <div class="finance-summary">
                        <div class="balance-card">
                            <label>Saldo Kas Saat Ini</label>
                            <h2 id="total-balance">Rp 0</h2>
                        </div>
                        <div class="summary-grid">
                            <div class="summary-item income">
                                <i class="fas fa-arrow-down"></i>
                                <div>
                                    <label>Pemasukan</label>
                                    <span id="total-income">Rp 0</span>
                                </div>
                            </div>
                            <div class="summary-item expense">
                                <i class="fas fa-arrow-up"></i>
                                <div>
                                    <label>Pengeluaran</label>
                                    <span id="total-expense">Rp 0</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="section-header">
                        <h3>Riwayat Transaksi</h3>
                        <button onclick="exportFinance()" class="btn-export">
                            <i class="fas fa-file-pdf"></i> Export .PDF
                        </button>
                    </div>
                    <div id="finance-list" class="list-wrapper">
                        <!-- Finance items injected here -->
                    </div>
                </div>
            </main>

            <!-- Bottom Actions (Floating Button for Admin) -->
            <div id="admin-actions" class="hidden">
                <button id="btn-add-post" class="fab-btn">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <!-- Bottom Navigation -->
            <footer class="bottom-nav">
                <button class="nav-item active" data-target="home">
                    <i class="fas fa-home"></i>
                    <span>Beranda</span>
                </button>
                <button class="nav-item" data-target="finance">
                    <i class="fas fa-wallet"></i>
                    <span>Kas</span>
                </button>
                <button class="nav-item" id="nav-members" data-target="members">
                    <i class="fas fa-address-book"></i>
                    <span>Anggota</span>
                    <span id="member-badge" class="badge-notify hidden">0</span>
                </button>
                <button class="nav-item" data-target="profile">
                    <i class="fas fa-user-circle"></i>
                    <span>Profil</span>
                </button>
            </footer>
        </section>

        <!-- Modals -->
        <div id="modal-overlay" class="modal-overlay">
            <!-- Modal Post -->
            <div id="modal-post" class="modal-content">
                <div class="modal-header">
                    <h3>Buat Pengumuman</h3>
                    <button class="btn-close">&times;</button>
                </div>
                <form id="post-form">
                    <div class="input-group">
                        <label>Judul Pengumuman</label>
                        <input type="text" id="post-title" placeholder="Tulis judul..." required>
                    </div>
                    <div class="input-group">
                        <label>Isi Pesan</label>
                        <textarea id="post-content" rows="6" placeholder="Tulis pesan lengkap di sini..."
                            required></textarea>
                    </div>
                    <button type="submit" class="btn-primary full-width">Kirim Pengumuman</button>
                </form>
            </div>

            <!-- Modal Detail -->
            <div id="modal-detail" class="modal-content">
                <div class="modal-header">
                    <div class="sender-info">
                        <div class="avatar small" id="detail-avatar"></div>
                        <div>
                            <h4 id="detail-sender">Nama Pengirim</h4>
                            <span id="detail-date">Tanggal</span>
                        </div>
                    </div>
                    <button class="btn-close">&times;</button>
                </div>
                <div class="modal-body">
                    <h2 id="detail-title">Judul</h2>
                    <div id="detail-body" class="rich-text">
                        <!-- Message content -->
                    </div>
                </div>
            </div>

            <!-- Modal Finance -->
            <div id="modal-finance" class="modal-content">
                <div class="modal-header">
                    <h3>Input Kas Baru</h3>
                    <button class="btn-close">&times;</button>
                </div>
                <form id="finance-form">
                    <div class="input-group">
                        <label>Jenis Transaksi</label>
                        <select id="finance-type" class="full-width-select" required>
                            <option value="income">Pemasukan (Uang Masuk)</option>
                            <option value="expense">Pengeluaran (Uang Keluar)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Jumlah (Rp)</label>
                        <input type="number" id="finance-amount" placeholder="Contoh: 50000" required>
                    </div>
                    <div class="input-group">
                        <label>Keterangan / Keperluan</label>
                        <input type="text" id="finance-note" placeholder="Contoh: Iuran Bulanan atau Beli Konsumsi" required>
                    </div>
                    <button type="submit" class="btn-primary full-width">Simpan Transaksi</button>
                </form>
            </div>
        </div> <!-- End of modal-overlay -->
    </div> <!-- End of app -->

        <script src="script.js?v=6"></script>
</body>

</html>
